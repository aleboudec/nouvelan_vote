<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vote Thème de Soirée</title>
<script type="module">
  // ====== IMPORTS FIREBASE (via CDN) ======
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyB-Hv3dU-vuB8U0IAk3AUdIiqv1Ykmn4x8",
    authDomain: "nouvelan-a256f.firebaseapp.com",
    databaseURL: "https://nouvelan-a256f-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "nouvelan-a256f",
    storageBucket: "nouvelan-a256f.firebasestorage.app",
    messagingSenderId: "312028300581",
    appId: "1:312028300581:web:f2f53dc6f57523dc5d06cc"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ====== ÉTAT ======
  let themes = {};       // { themeId: { name, owner } }
  let votes = {};        // { pseudo: themeId }
  let me = localStorage.getItem('soiree_pseudo') || null;

  // ====== CONNEXION ======
  window.login = () => {
    const input = document.getElementById('pseudoInput');
    const pseudo = input.value.trim();
    if (!pseudo) return alert("Remplis ton pseudo !");

    me = pseudo;
    localStorage.setItem('soiree_pseudo', pseudo);
    updateUI();
  };

  function updateUI() {
    if (me) {
      document.getElementById('authZone').style.display = 'none';
      document.getElementById('welcome').textContent = `Salut ${me} ! 👋`;
    }
    render();
  }

  function myVoteText() {
    if (!me) return "";
    if (!votes[me]) return "Tu n'as pas encore voté.";
    const t = themes[votes[me]];
    return `Ton vote actuel : ${t ? `"${t.name}"` : "(thème supprimé)"} — tu peux le changer quand tu veux !`;
  }

  // ====== PROPOSER UN THÈME (libre, pas besoin de pseudo) ======
  window.propose = async () => {
    const input = document.getElementById('themeInput');
    const name = input.value.trim();
    if (!name) return;
    const owner = me || "Anonyme";
    await set(ref(db, 'themes/' + Date.now()), { name: name, owner: owner });
    input.value = '';
  };

  // ====== VOTER (pseudo obligatoire) ======
  window.vote = (id) => {
    if (!me) {
      document.getElementById('pseudoInput').focus();
      return alert("Entre ton pseudo d'abord pour pouvoir voter ! 🔑");
    }
    set(ref(db, `votes/${me}`), id);
  };

  // ====== ÉCOUTE TEMPS RÉEL ======
  onValue(ref(db, 'themes'), snap => { themes = snap.val() || {}; render(); });
  onValue(ref(db, 'votes'), snap => { votes = snap.val() || {}; render(); });

  function render() {
    const list = document.getElementById('themeList');
    list.innerHTML = '';
    const entries = Object.entries(themes).sort((a, b) => count(b[0]) - count(a[0]));
    const max = Math.max(1, ...entries.map(([id]) => count(id)));

    entries.forEach(([id, t]) => {
      const c = count(id);
      const voters = getVoters(id);
      const div = document.createElement('div');
      div.className = 'theme-item' + (me && votes[me] === id ? ' voted' : '');
      div.innerHTML = `
        <div class="theme-header">
          <span class="theme-name">${t.name}</span>
          <span class="votes">${c} vote${c > 1 ? 's' : ''}</span>
          ${me ? `<button class="vote-btn ${votes[me] === id ? 'active' : ''}" onclick="vote('${id}')">
            ${votes[me] === id ? '✓ Mon vote' : 'Voter'}
          </button>` : `<button class="vote-btn locked" onclick="vote('${id}')">🔒 Voter</button>`}
        </div>
        ${voters.length ? `<div class="voters">👥 ${voters.join(', ')}</div>` : '<div class="voters empty">Personne n\'a encore voté</div>'}
        <div class="bar-container"><div class="bar" style="width:${c / max * 100}%"></div></div>
      `;
      list.appendChild(div);
    });
    document.getElementById('myVoteLabel').textContent = myVoteText();
  }

  function count(id) {
    return Object.values(votes).filter(v => v === id).length;
  }

  function getVoters(id) {
    return Object.entries(votes)
      .filter(([, themeId]) => themeId === id)
      .map(([pseudo]) => pseudo)
      .sort((a, b) => a.localeCompare(b, 'fr'));
  }

  // ====== INIT ======
  updateUI();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1a1a2e, #16213e); min-height: 100vh; color: #fff; padding: 20px; }
  .container { max-width: 600px; margin: 0 auto; }
  h1 { text-align: center; margin-bottom: 25px; font-size: 1.7em; }
  h2 { margin-bottom: 12px; font-size: 1.15em; }
  .card { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: none; margin-bottom: 10px; font-size: 1em; }
  button { background: #e94560; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 0.95em; transition: 0.2s; }
  button:hover { background: #ff6b81; }
  .theme-item { padding: 12px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 10px; }
  .theme-item.voted { border: 2px solid #e94560; }
  .theme-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .theme-name { flex: 1; font-weight: 600; min-width: 120px; }
  .votes { font-weight: bold; color: #ffd369; }
  .vote-btn { background: transparent; border: 2px solid #e94560; }
  .vote-btn.active { background: #e94560; }
  .vote-btn.locked { border-color: #888; color: #aaa; }
  .vote-btn.locked:hover { border-color: #e94560; color: #fff; }
  .voters { font-size: 0.85em; color: #ccc; margin-top: 8px; }
  .voters.empty { color: #888; font-style: italic; }
  .bar-container { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .bar { height: 100%; background: linear-gradient(90deg, #e94560, #ffd369); transition: width 0.4s; }
  #welcome { font-size: 1em; color: #ffd369; margin-bottom: 8px; }
  #myVoteLabel { font-size: 0.9em; color: #ccc; margin-bottom: 15px; }
</style>
</head>
<body>
<div class="container">
  <h1>🎉 Vote du Thème de Soirée</h1>

  <!-- Zone pseudo (seulement pour débloquer le vote) -->
  <div class="card" id="authZone">
    <h2>🔑 Pour voter, dis-nous qui tu es !</h2>
    <p style="color:#ccc; font-size:0.9em; margin-bottom:12px;">Tu peux proposer des thèmes sans pseudo, mais pour voter il faut t'identifier (un seul vote par personne, modifiable à tout moment !).</p>
    <input type="text" id="pseudoInput" placeholder="Ton pseudo (ex : Julie)" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Entrer 🚀</button>
  </div>

  <div id="welcome"></div>
  <div id="myVoteLabel"></div>

  <!-- Proposer un thème : TOUJOURS accessible -->
  <div class="card">
    <h2>💡 Proposer un thème</h2>
    <input type="text" id="themeInput" placeholder="Ex : Soirée années 80 🕺">
    <button onclick="propose()">Proposer</button>
  </div>

  <!-- Les thèmes : TOUJOURS visibles -->
  <div class="card">
    <h2>🗳 Les thèmes</h2>
    <div id="themeList"></div>
  </div>
</div>
</body>
</html>
